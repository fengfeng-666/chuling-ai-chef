# 厨灵 Nginx 配置
# 放到 /etc/nginx/sites-available/chuling，然后 ln -s 到 sites-enabled/

upstream chuling_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # SSL 证书 (acme.sh / certbot)
    ssl_certificate     /etc/nginx/ssl/chuling/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/chuling/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # 前端静态文件
    location / {
        root /opt/chuling/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://chuling_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 流式输出关键配置
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # 上传文件大小限制
        client_max_body_size 20m;
    }

    # 上传文件
    location /uploads/ {
        alias /opt/chuling/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
